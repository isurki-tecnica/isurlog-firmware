site_name: ISURLOG Docs
site_description: ISURLOG documentation — hardware, firmware, data integration, and troubleshooting
site_url: https://isurki-tecnica.github.io/isurlog-firmware/
repo_url: https://github.com/isurki-tecnica/isurlog-firmware
repo_name: isurki-tecnica/isurlog-firmware

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - content.code.copy

nav:
  - Home: index.md
  - 🛠️ Module A - Use and Hardware:
      - 2. Sensor Connections: sensor-connections.md
      - 3. Power Supply Methods: power-supply.md
      - Power Budget Calculator: power-budget.md
      - 4. Communications: communications.md
      - 5. Installation and Commissioning: installation-commissioning.md
      - 6. Datalogger Operation: datalogger-operation.md
      - 7. IsurDASH Platform:
          - Overview: isurdash-platform.md
          - 7.1. Access and Login: isurdash-access-login.md
          - 7.2. Dashboard: isurdash-dashboard.md
          - 7.3. Devices: isurdash-devices.md
          - 7.4. Alarms: isurdash-alarms.md
          - 7.5. Users: isurdash-users.md
          - 7.6. Profiles: isurdash-profiles.md
          - 7.7. Tags: isurdash-tags.md
          - 7.8. Device Maintenance: isurdash-maintenance.md
      - 8. Reference Configuration Parameters: reference-parameters.md
  - 💻 Module B - Firmware Development:
      - 1. Build Environment Setup: build-environment.md
      - 2. Architecture Overview: architecture-overview.md
      - 2.1. Module & Library Reference: module-library-reference.md
      - 3. Flashing and Application Upload: flashing-application-upload.md
      - 4. GPIO Mapping (Hardware-Software): gpio-mapping.md
      - 5. Advanced NB-IoT Modem Guide: nbiot-modem-guide.md
      - 6. Advanced LoRaWAN Modem Guide: lorawan-modem-guide.md
      - 7. Contribution Guide: contribution-guide.md
  - ☁️ Module C - Data Integration & APIs:
      - 9. Data Access Overview: data-access-overview.md
      - 10. Historical Data (InfluxDB): historical-data-influxdb.md
      - 11. Real-Time Data (MQTT): realtime-data-mqtt.md
      - 12. Remote Configuration API (Downlink): remote-configuration-api.md
  - 🩺 Module D - Troubleshooting:
      - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
