site_name: ISURLOG Docs
site_description: ISURLOG documentation — hardware, firmware, data integration, and troubleshooting
site_url: https://docs.isurlog.isurki.com/
repo_url: https://github.com/isurki-tecnica/isurlog-firmware
repo_name: isurki-tecnica/isurlog-firmware

# The blog lives in docs/blog/ but is built separately (see mkdocs-blog.yml)
# and only merged into site/blog/ by deploy.sh. Excluded here so a plain
# `mkdocs build`/`mkdocs gh-deploy` on this config never publishes it.
exclude_docs: |
  blog/**

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            "🛠️ Module A - Use and Hardware": "🛠️ Módulo A - Uso y Hardware"
            "1. Sensor Connections": "1. Conexión de Sensores"
            "2. Power Supply Methods": "2. Métodos de Alimentación"
            "3. Communications": "3. Comunicaciones"
            "4. Installation and Commissioning": "4. Instalación y Puesta en Marcha"
            "5. Datalogger Operation": "5. Funcionamiento del Datalogger"
            "6. IsurDASH Platform": "6. Plataforma IsurDASH"
            Overview: "Visión General"
            "6.1. Access and Login": "6.1. Acceso e Inicio de Sesión"
            "6.2. Dashboard": "6.2. Dashboard"
            "6.3. Devices": "6.3. Dispositivos"
            "6.4. Alarms": "6.4. Alarmas"
            "6.5. Users": "6.5. Usuarios"
            "6.6. Profiles": "6.6. Perfiles"
            "6.7. Tags": "6.7. Tags"
            "6.8. Device Maintenance": "6.8. Mantenimiento de Dispositivos"
            "7. Reference Configuration Parameters": "7. Referencia de Parámetros de Configuración"
            "💻 Module B - Firmware Development": "💻 Módulo B - Desarrollo de Firmware"
            "1. Build Environment Setup": "1. Configuración del Entorno de Compilación"
            "2. Architecture Overview": "2. Visión General de la Arquitectura"
            "2.1. Module & Library Reference": "2.1. Referencia de Módulos y Librerías"
            "3. Flashing and Application Upload": "3. Grabado del Firmware y Carga de la Aplicación"
            "4. GPIO Mapping (Hardware-Software)": "4. Mapeo de GPIO (Hardware-Software)"
            "5. Advanced NB-IoT Modem Guide": "5. Guía Avanzada del Módem NB-IoT"
            "6. Advanced LoRaWAN Modem Guide": "6. Guía Avanzada del Módem LoRaWAN"
            "7. Contribution Guide": "7. Guía de Contribución"
            "☁️ Module C - Data Integration & APIs": "☁️ Módulo C - Integración de Datos y APIs"
            "1. Data Access Overview": "1. Resumen de Acceso a Datos"
            "2. Historical Data (InfluxDB)": "2. Datos Históricos (InfluxDB)"
            "3. Real-Time Data (MQTT)": "3. Datos en Tiempo Real (MQTT)"
            "4. Remote Configuration API (Downlink)": "4. API de Configuración Remota (Downlink)"
            "⚡ Module D - Power Consumption & Battery Life": "⚡ Módulo D - Consumo de Energía y Vida de la Batería"
            "1. Consumption Graphs": "1. Gráficos de Consumo"
            "2. Power Budget Calculator": "2. Calculadora de Consumo de Energía"
            "🩺 Module E - Troubleshooting": "🩺 Módulo E - Resolución de Problemas"
            "1. Troubleshooting": "1. Resolución de Problemas"
            "🧰 Module F - Parts and Accessories": "🧰 Módulo F - Piezas y Accesorios"
            "1. Parts and Accessories": "1. Piezas y Accesorios"
            "2. Build Your Own ISURLOG": "2. Configura tu ISURLOG"

nav:
  - Home: index.md
  # 📝 Blog: blog/index.md — re-add once the blog is ready to go live (see deploy.sh)
  - 🛠️ Module A - Use and Hardware:
      - 1. Sensor Connections: sensor-connections.md
      - 2. Power Supply Methods: power-supply.md
      - 3. Communications: communications.md
      - 4. Installation and Commissioning: installation-commissioning.md
      - 5. Datalogger Operation: datalogger-operation.md
      - 6. IsurDASH Platform:
          - Overview: isurdash-platform.md
          - 6.1. Access and Login: isurdash-access-login.md
          - 6.2. Dashboard: isurdash-dashboard.md
          - 6.3. Devices: isurdash-devices.md
          - 6.4. Alarms: isurdash-alarms.md
          - 6.5. Users: isurdash-users.md
          - 6.6. Profiles: isurdash-profiles.md
          - 6.7. Tags: isurdash-tags.md
          - 6.8. Device Maintenance: isurdash-maintenance.md
      - 7. Reference Configuration Parameters: reference-parameters.md
  - 💻 Module B - Firmware Development:
      - 1. Build Environment Setup: build-environment.md
      - 2. Architecture Overview: architecture-overview.md
      - 2.1. Module & Library Reference: module-library-reference.md
      - 3. Flashing and Application Upload: flashing-application-upload.md
      - 4. GPIO Mapping (Hardware-Software): gpio-mapping.md
      - 5. Advanced NB-IoT Modem Guide: nbiot-modem-guide.md
      - 6. Advanced LoRaWAN Modem Guide: lorawan-modem-guide.md
      - 7. Contribution Guide: contribution-guide.md
  - ☁️ Module C - Data Integration & APIs:
      - 1. Data Access Overview: data-access-overview.md
      - 2. Historical Data (InfluxDB): historical-data-influxdb.md
      - 3. Real-Time Data (MQTT): realtime-data-mqtt.md
      - 4. Remote Configuration API (Downlink): remote-configuration-api.md
  - ⚡ Module D - Power Consumption & Battery Life:
      - 1. Consumption Graphs: consumption-graphs.md
      - 2. Power Budget Calculator: power-budget.md
  - 🩺 Module E - Troubleshooting:
      - 1. Troubleshooting: troubleshooting.md
  - 🧰 Module F - Parts and Accessories:
      - 1. Parts and Accessories: parts-and-accessories.md
      - 2. Build Your Own ISURLOG: configurator.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences

extra:
  analytics:
    provider: google
    property: G-639QHEW68F
