<svg viewBox="0 0 680 240" width="680" height="240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>ISURLOG digital input wiring schematic — dry contact between VIN and DIN0</title>

  <rect x="0" y="0" width="680" height="240" fill="#ffffff"/>

  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Digital Input Wiring</text>
  <text x="340" y="50" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Same wiring for State mode and Pulse Counter mode</text>

  <!-- ISURLOG box -->
  <rect x="40" y="70" width="150" height="140" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="115" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">ISURLOG</text>
  <text x="115" y="153" text-anchor="middle" font-size="11" fill="#64748b">Digital Input</text>

  <circle cx="190" cy="110" r="4" fill="#334155"/>
  <text x="182" y="106" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">VIN</text>

  <circle cx="190" cy="170" r="4" fill="#334155"/>
  <text x="182" y="166" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">DIN0</text>

  <!-- External contact box -->
  <rect x="420" y="80" width="220" height="140" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="530" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">EXTERNAL CONTACT</text>
  <text x="530" y="146" text-anchor="middle" font-size="10.5" fill="#92400e">(switch, reed contact, or</text>
  <text x="530" y="160" text-anchor="middle" font-size="10.5" fill="#92400e">flow/water-meter pulse output)</text>

  <circle cx="420" cy="110" r="4" fill="#334155"/>
  <circle cx="420" cy="170" r="4" fill="#334155"/>

  <!-- Switch symbol: two stubs + a diagonal "lever" showing the contact open -->
  <line x1="420" y1="110" x2="420" y2="130" stroke="#334155" stroke-width="2"/>
  <line x1="420" y1="130" x2="432" y2="160" stroke="#334155" stroke-width="2"/>
  <line x1="420" y1="160" x2="420" y2="170" stroke="#334155" stroke-width="2"/>
  <text x="440" y="148" text-anchor="start" font-size="10" fill="#64748b" font-style="italic">NO</text>

  <!-- Wires: ISURLOG <-> external contact -->
  <line x1="190" y1="110" x2="418" y2="110" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="190" y1="170" x2="418" y2="170" stroke="#1d4ed8" stroke-width="2"/>
</svg>
