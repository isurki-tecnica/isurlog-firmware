<svg viewBox="0 0 900 300" width="900" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Esquema de cableado Modbus RTU (RS485) del ISURLOG en cadena, con la ubicación de la terminación</title>

  <rect x="0" y="0" width="900" height="300" fill="#ffffff"/>

  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Cableado Modbus RTU (RS485) — Conexión en Cadena</text>
  <text x="450" y="45" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Nunca en paralelo/estrella — A/B/GND se encadenan a través de cada sensor</text>

  <!-- Caja ISURLOG - ensanchada respecto a los otros esquemas para que la resistencia integrada
       tenga su propio espacio a la izquierda de los pines, sin competir con sus etiquetas -->
  <rect x="30" y="70" width="190" height="160" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="125" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">ISURLOG</text>
  <text x="125" y="213" text-anchor="middle" font-size="11" fill="#64748b">RS485 / Modbus</text>

  <circle cx="220" cy="100" r="4" fill="#334155"/>
  <text x="212" y="96" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">A</text>

  <circle cx="220" cy="130" r="4" fill="#334155"/>
  <text x="212" y="123" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">B</text>

  <circle cx="220" cy="160" r="4" fill="#334155"/>
  <text x="212" y="156" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">GND</text>

  <!-- Bus A, B, GND desde el ISURLOG hasta el ultimo sensor -->
  <line x1="220" y1="100" x2="850" y2="100" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="220" y1="130" x2="850" y2="130" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="220" y1="160" x2="850" y2="160" stroke="#94a3b8" stroke-width="2"/>

  <!-- Terminacion de 120 ohm integrada - dibujada DENTRO de la caja ISURLOG, bien alejada de las
       etiquetas de los pines A/B ahora que la caja es mas ancha -->
  <line x1="220" y1="100" x2="186" y2="100" stroke="#991b1b" stroke-width="2"/>
  <line x1="186" y1="100" x2="186" y2="108" stroke="#991b1b" stroke-width="2"/>
  <rect x="178" y="108" width="16" height="14" fill="#fff1f2" stroke="#991b1b" stroke-width="1.5"/>
  <line x1="186" y1="122" x2="186" y2="130" stroke="#991b1b" stroke-width="2"/>
  <line x1="186" y1="130" x2="220" y2="130" stroke="#991b1b" stroke-width="2"/>
  <text x="174" y="119" text-anchor="end" font-size="9.5" font-weight="bold" fill="#991b1b">120 Ω</text>

  <!-- Sensor 1 -->
  <rect x="280" y="185" width="110" height="75" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="335" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">SENSOR 1</text>
  <text x="335" y="231" text-anchor="middle" font-size="10" fill="#92400e">(esclavo Modbus)</text>

  <line x1="305" y1="185" x2="305" y2="100" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="305" cy="100" r="3" fill="#1d4ed8"/>
  <line x1="335" y1="185" x2="335" y2="130" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="335" cy="130" r="3" fill="#1d4ed8"/>
  <line x1="365" y1="185" x2="365" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="365" cy="160" r="3" fill="#94a3b8"/>

  <!-- Elipsis de continuacion -->
  <text x="520" y="228" text-anchor="middle" font-size="22" font-weight="bold" fill="#94a3b8">···</text>
  <text x="520" y="245" text-anchor="middle" font-size="10.5" fill="#64748b" font-style="italic">(hasta 32 sensores en total)</text>

  <!-- Ultimo sensor -->
  <rect x="650" y="185" width="110" height="75" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="705" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">SENSOR N</text>
  <text x="705" y="231" text-anchor="middle" font-size="10" fill="#92400e">(último del bus)</text>

  <line x1="675" y1="185" x2="675" y2="100" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="675" cy="100" r="3" fill="#1d4ed8"/>
  <line x1="705" y1="185" x2="705" y2="130" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="705" cy="130" r="3" fill="#1d4ed8"/>
  <line x1="735" y1="185" x2="735" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="735" cy="160" r="3" fill="#94a3b8"/>

  <!-- Terminacion de 120 ohm externa obligatoria en el ultimo sensor -->
  <line x1="800" y1="100" x2="800" y2="108" stroke="#991b1b" stroke-width="2"/>
  <rect x="790" y="108" width="20" height="14" fill="#fff1f2" stroke="#991b1b" stroke-width="1.5"/>
  <line x1="800" y1="122" x2="800" y2="130" stroke="#991b1b" stroke-width="2"/>
  <text x="818" y="119" text-anchor="start" font-size="11" font-weight="bold" fill="#991b1b">120 Ω</text>

  <text x="450" y="278" text-anchor="middle" font-size="10.5" fill="#475569">Terminación 120 Ω: integrada en el ISURLOG · añadir externamente solo en el ÚLTIMO sensor · nunca en los intermedios</text>
</svg>
