<svg viewBox="0 0 680 265" width="680" height="265" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Esquema de cableado de la salida digital (relé) del ISURLOG — COM0/NO0 conmutando una carga con alimentación externa</title>

  <rect x="0" y="0" width="680" height="265" fill="#ffffff"/>

  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Cableado de la Salida Digital (Relé)</text>
  <text x="340" y="50" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Relé de estado sólido, 2A / 60V — conmuta una carga con alimentación externa</text>

  <!-- Caja ISURLOG, ensanchada para que el simbolo del rele tenga su propio espacio dentro,
       lejos de las etiquetas de los pines -->
  <rect x="40" y="70" width="170" height="160" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="125" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">ISURLOG</text>
  <text x="125" y="213" text-anchor="middle" font-size="11" fill="#64748b">Salida Digital</text>

  <circle cx="210" cy="100" r="4" fill="#334155"/>
  <text x="202" y="96" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">COM0</text>

  <circle cx="210" cy="160" r="4" fill="#334155"/>
  <text x="202" y="156" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">NO0</text>

  <!-- Simbolo del rele - dibujado DENTRO del ISURLOG porque es un componente interno, mismo
       estilo de interruptor abierto que el contacto externo de la entrada digital -->
  <line x1="210" y1="100" x2="150" y2="100" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="100" x2="150" y2="120" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="120" x2="162" y2="150" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="150" x2="150" y2="160" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="160" x2="210" y2="160" stroke="#334155" stroke-width="2"/>
  <text x="138" y="132" text-anchor="end" font-size="10" fill="#64748b" font-style="italic">relé</text>

  <!-- Caja de carga externa -->
  <rect x="420" y="80" width="220" height="140" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="530" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">CARGA EXTERNA</text>
  <text x="530" y="146" text-anchor="middle" font-size="10.5" fill="#92400e">(bomba, válvula, contactor,</text>
  <text x="530" y="160" text-anchor="middle" font-size="10.5" fill="#92400e">u otro actuador)</text>

  <circle cx="420" cy="100" r="4" fill="#334155"/>
  <circle cx="420" cy="160" r="4" fill="#334155"/>

  <!-- Cables -->
  <line x1="210" y1="100" x2="418" y2="100" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="210" y1="160" x2="418" y2="160" stroke="#1d4ed8" stroke-width="2"/>

  <text x="340" y="252" text-anchor="middle" font-size="10.5" fill="#475569">La carga trae su propia alimentación — COM0/NO0 solo cierran el circuito, como cualquier interruptor.</text>
</svg>
