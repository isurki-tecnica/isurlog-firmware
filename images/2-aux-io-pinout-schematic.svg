<svg viewBox="0 0 520 500" width="520" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>ISURLOG AUX-IO connector pinout — 9 pins grouped by function</title>

  <rect x="0" y="0" width="520" height="500" fill="#ffffff"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">AUX-IO Connector Pinout</text>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">1mm pitch — pin 1 marked with a triangle, like the PCB silkscreen</text>

  <!-- Group background bands, drawn first so labels sit on top -->
  <rect x="210" y="115" width="270" height="130" rx="6" fill="#eff6ff"/>
  <rect x="210" y="250" width="270" height="85" rx="6" fill="#f5f3ff"/>
  <rect x="210" y="340" width="270" height="85" rx="6" fill="#fff7ed"/>

  <!-- Connector housing -->
  <rect x="220" y="70" width="30" height="400" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>

  <!-- Pin 1 marker: triangle on the silkscreen, pointing at the bottom pin -->
  <polygon points="200,450 214,444 214,456" fill="#334155"/>

  <!-- Pin 1: 3V3 (power) -->
  <rect x="225" y="446" width="10" height="8" fill="#334155"/>
  <line x1="250" y1="450" x2="280" y2="450" stroke="#334155" stroke-width="1.5"/>
  <text x="285" y="454" font-size="13"><tspan fill="#64748b">Pin 1 </tspan><tspan fill="#1e293b" font-weight="bold">3V3</tspan><tspan fill="#64748b" font-style="italic" font-size="11"> (power)</tspan></text>

  <!-- Pin 2: NO2 (relay 2) -->
  <rect x="225" y="401" width="10" height="8" fill="#b45309"/>
  <line x1="250" y1="405" x2="280" y2="405" stroke="#b45309" stroke-width="1.5"/>
  <text x="285" y="409" font-size="13"><tspan fill="#64748b">Pin 2 </tspan><tspan fill="#7c2d12" font-weight="bold">NO2</tspan><tspan fill="#64748b" font-style="italic" font-size="11"> (relay 2)</tspan></text>

  <!-- Pin 3: COM2 (relay 2) -->
  <rect x="225" y="356" width="10" height="8" fill="#b45309"/>
  <line x1="250" y1="360" x2="280" y2="360" stroke="#b45309" stroke-width="1.5"/>
  <text x="285" y="364" font-size="13"><tspan fill="#64748b">Pin 3 </tspan><tspan fill="#7c2d12" font-weight="bold">COM2</tspan><tspan fill="#64748b" font-style="italic" font-size="11"> (relay 2)</tspan></text>

  <!-- Pin 4: NO1 (relay 1) -->
  <rect x="225" y="311" width="10" height="8" fill="#7c3aed"/>
  <line x1="250" y1="315" x2="280" y2="315" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="285" y="319" font-size="13"><tspan fill="#64748b">Pin 4 </tspan><tspan fill="#5b21b6" font-weight="bold">NO1</tspan><tspan fill="#64748b" font-style="italic" font-size="11"> (relay 1)</tspan></text>

  <!-- Pin 5: COM1 (relay 1) -->
  <rect x="225" y="266" width="10" height="8" fill="#7c3aed"/>
  <line x1="250" y1="270" x2="280" y2="270" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="285" y="274" font-size="13"><tspan fill="#64748b">Pin 5 </tspan><tspan fill="#5b21b6" font-weight="bold">COM1</tspan><tspan fill="#64748b" font-style="italic" font-size="11"> (relay 1)</tspan></text>

  <!-- Pin 6: GP3 (GPIO) -->
  <rect x="225" y="221" width="10" height="8" fill="#1d4ed8"/>
  <line x1="250" y1="225" x2="280" y2="225" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="285" y="229" font-size="13"><tspan fill="#64748b">Pin 6 </tspan><tspan fill="#1e3a8a" font-weight="bold">GP3</tspan><tspan fill="#64748b" font-style="italic" font-size="11"> (GPIO)</tspan></text>

  <!-- Pin 7: GP4 (GPIO) -->
  <rect x="225" y="176" width="10" height="8" fill="#1d4ed8"/>
  <line x1="250" y1="180" x2="280" y2="180" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="285" y="184" font-size="13"><tspan fill="#64748b">Pin 7 </tspan><tspan fill="#1e3a8a" font-weight="bold">GP4</tspan><tspan fill="#64748b" font-style="italic" font-size="11"> (GPIO)</tspan></text>

  <!-- Pin 8: GP5 (GPIO) -->
  <rect x="225" y="131" width="10" height="8" fill="#1d4ed8"/>
  <line x1="250" y1="135" x2="280" y2="135" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="285" y="139" font-size="13"><tspan fill="#64748b">Pin 8 </tspan><tspan fill="#1e3a8a" font-weight="bold">GP5</tspan><tspan fill="#64748b" font-style="italic" font-size="11"> (GPIO)</tspan></text>

  <!-- Pin 9: GND (ground) -->
  <rect x="225" y="86" width="10" height="8" fill="#334155"/>
  <line x1="250" y1="90" x2="280" y2="90" stroke="#334155" stroke-width="1.5"/>
  <text x="285" y="94" font-size="13"><tspan fill="#64748b">Pin 9 </tspan><tspan fill="#1e293b" font-weight="bold">GND</tspan><tspan fill="#64748b" font-style="italic" font-size="11"> (ground)</tspan></text>

  <text x="260" y="480" text-anchor="middle" font-size="10.5" fill="#475569">Relays 1 &amp; 2 here are a separate dual relay chip (GAQW212GEH) — not the COM0/NO0 relay from 1.5.</text>
</svg>
