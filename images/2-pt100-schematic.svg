<svg viewBox="0 0 1000 340" width="1000" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>ISURLOG PT100 wiring schematic — 2-wire, 3-wire, and 4-wire probe configurations</title>

  <rect x="0" y="0" width="1000" height="340" fill="#ffffff"/>

  <!-- Panel dividers -->
  <line x1="340" y1="20" x2="340" y2="310" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="670" y1="20" x2="670" y2="310" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ============ PANEL 1: 2-WIRE ============ -->
  <text x="175" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">2-Wire</text>
  <text x="175" y="50" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Simplest — lead resistance adds error</text>

  <!-- ISURLOG box: F+ and F- are each duplicated (2 physical terminals per net) -->
  <rect x="30" y="90" width="70" height="200" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">ISURLOG</text>

  <circle cx="100" cy="125" r="4" fill="#334155"/>
  <text x="92" y="121" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">F+</text>
  <circle cx="100" cy="155" r="4" fill="#cbd5e1"/>
  <text x="92" y="151" text-anchor="end" font-size="12" font-weight="bold" fill="#94a3b8">F+</text>

  <circle cx="100" cy="225" r="4" fill="#334155"/>
  <text x="92" y="221" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">F−</text>
  <circle cx="100" cy="255" r="4" fill="#cbd5e1"/>
  <text x="92" y="251" text-anchor="end" font-size="12" font-weight="bold" fill="#94a3b8">F−</text>

  <rect x="180" y="165" width="20" height="50" rx="3" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="190" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7c2d12">PT100</text>

  <polyline points="100,125 190,125 190,165" stroke="#1d4ed8" stroke-width="2" fill="none"/>
  <polyline points="100,225 190,225 190,215" stroke="#1d4ed8" stroke-width="2" fill="none"/>

  <!-- ============ PANEL 2: 3-WIRE ============ -->
  <text x="505" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">3-Wire</text>
  <text x="505" y="50" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">2 common leads, each to its own F+ terminal</text>

  <rect x="360" y="90" width="70" height="200" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="395" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">ISURLOG</text>

  <circle cx="430" cy="125" r="4" fill="#334155"/>
  <text x="422" y="121" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">F+</text>
  <circle cx="430" cy="155" r="4" fill="#334155"/>
  <text x="422" y="151" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">F+</text>

  <circle cx="430" cy="225" r="4" fill="#334155"/>
  <text x="422" y="221" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">F−</text>
  <circle cx="430" cy="255" r="4" fill="#cbd5e1"/>
  <text x="422" y="251" text-anchor="end" font-size="12" font-weight="bold" fill="#94a3b8">F−</text>

  <rect x="510" y="165" width="20" height="50" rx="3" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="520" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7c2d12">PT100</text>

  <!-- Two separate common leads, each to its own F+ terminal - no merging -->
  <polyline points="430,125 513,125 513,165" stroke="#1d4ed8" stroke-width="2" fill="none"/>
  <polyline points="430,155 527,155 527,165" stroke="#1d4ed8" stroke-width="2" fill="none"/>
  <text x="536" y="140" text-anchor="start" font-size="10" fill="#1d4ed8" font-style="italic">common (≈2Ω) x2</text>

  <!-- Single lead to one F- terminal; the second F- is unused -->
  <polyline points="430,225 520,225 520,215" stroke="#1d4ed8" stroke-width="2" fill="none"/>
  <text x="536" y="222" text-anchor="start" font-size="10" fill="#1d4ed8" font-style="italic">≈100Ω</text>

  <!-- ============ PANEL 3: 4-WIRE ============ -->
  <text x="835" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">4-Wire</text>
  <text x="835" y="50" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Most accurate — full lead compensation</text>

  <rect x="690" y="90" width="70" height="200" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="725" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">ISURLOG</text>

  <circle cx="760" cy="125" r="4" fill="#334155"/>
  <text x="752" y="121" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">F+</text>
  <circle cx="760" cy="155" r="4" fill="#334155"/>
  <text x="752" y="151" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">F+</text>

  <circle cx="760" cy="225" r="4" fill="#334155"/>
  <text x="752" y="221" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">F−</text>
  <circle cx="760" cy="255" r="4" fill="#334155"/>
  <text x="752" y="251" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">F−</text>

  <rect x="840" y="165" width="20" height="50" rx="3" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="850" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7c2d12">PT100</text>

  <!-- Two separate leads at each end, each to its own terminal - no merging -->
  <polyline points="760,125 843,125 843,165" stroke="#1d4ed8" stroke-width="2" fill="none"/>
  <polyline points="760,155 857,155 857,165" stroke="#1d4ed8" stroke-width="2" fill="none"/>
  <text x="866" y="140" text-anchor="start" font-size="10" fill="#1d4ed8" font-style="italic">common (≈2Ω) x2</text>

  <polyline points="760,225 843,225 843,215" stroke="#1d4ed8" stroke-width="2" fill="none"/>
  <polyline points="760,255 857,255 857,215" stroke="#1d4ed8" stroke-width="2" fill="none"/>
  <text x="866" y="222" text-anchor="start" font-size="10" fill="#1d4ed8" font-style="italic">common (≈2Ω) x2</text>

  <text x="500" y="325" text-anchor="middle" font-size="11" fill="#475569">F+/F− are each duplicated on the terminal block for this reason. Grey pins = unused for this wire count. PCB jumpers must also match (see photo above).</text>
</svg>
